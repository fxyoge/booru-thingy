name: CI
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U test -d test" --health-interval 5s --health-timeout 3s --health-retries 20
      s3:
        image: motoserver/moto:5.2.4
        ports: [ '5000:5000' ]
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      TEST_S3_ENDPOINT: http://localhost:5000
      TEST_S3_ACCESS_KEY: local-access-key
      TEST_S3_SECRET_KEY: local-secret-key
      CARGO_BUILD_JOBS: 2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
    - uses: sqlc-dev/setup-sqlc@c0209b9199cd1cce6a14fc27cabcec491b651761 # v4
      with:
        sqlc-version: '1.30.0'
    - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
    - run: just check-sql
    - run: sudo apt-get update && sudo apt-get install -y ffmpeg libvips-tools
    - run: cargo fmt --check
    - run: cargo clippy --locked --all-targets -- -D warnings
    - run: cargo test --locked
    - run: cargo test --locked -- --ignored
    - name: Check frontend modules
      run: |
        for file in assets/*.js assets/components/*.js; do
          node --input-type=module --check < "$file"
        done

  image:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      id: meta
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        push: false
        load: true
        tags: booru-thingy:e2e
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - run: docker run --rm booru-thingy:e2e --help
    - name: Export image for E2E jobs
      run: docker save --output "$RUNNER_TEMP/booru-image.tar" booru-thingy:e2e
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: e2e-image
        path: ${{ runner.temp }}/booru-image.tar
        compression-level: 0
        retention-days: 1

  e2e:
    name: E2E (${{ matrix.storage }}, ${{ matrix.deployment }})
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - storage: seaweedfs
          deployment: combined
          compose_file: .github/e2e/compose.yaml
          compose_profiles: ''
        - storage: seaweedfs
          deployment: split
          compose_file: .github/e2e/compose.yaml:.github/e2e/split.yaml
          compose_profiles: split
        - storage: garage
          deployment: combined
          compose_file: .github/e2e/garage.yaml
          compose_profiles: ''
    env:
      TEST_BASE_URL: http://localhost:8080
      TEST_SOURCE_URL: http://localhost:8090
      OWNER_LOGIN: owner
      OWNER_API_KEY: e2e-test-key
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: tests/e2e/requirements.txt
    - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: e2e-image
        path: ${{ runner.temp }}/e2e-image
    - run: docker load --input "$RUNNER_TEMP/e2e-image/booru-image.tar"
    - name: Install test dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg
        python -m pip install -r tests/e2e/requirements.txt
        python -m playwright install chromium --with-deps
    - name: Run frontend browser regressions
      run: python -m pytest tests/frontend --tracing=retain-on-failure --screenshot=only-on-failure --output=test-results/frontend --junitxml=test-results/frontend.xml
    - name: Provision deployment
      # These selectors are not present in the test command's environment.
      env:
        COMPOSE_FILE: ${{ matrix.compose_file }}
        COMPOSE_PROFILES: ${{ matrix.compose_profiles }}
        COMPOSE_PROJECT_NAME: booru-e2e
      run: |
        docker compose up -d
        curl --fail --silent --show-error --retry 60 --retry-delay 1 \
          --retry-all-errors --connect-timeout 2 --max-time 6 \
          http://localhost:8080/readyz
    - name: Run shared E2E suite
      run: just e2e
    - name: Collect deployment diagnostics
      if: always()
      env:
        COMPOSE_FILE: ${{ matrix.compose_file }}
        COMPOSE_PROFILES: ${{ matrix.compose_profiles }}
        COMPOSE_PROJECT_NAME: booru-e2e
      run: |
        mkdir -p test-results
        docker compose logs --no-color > test-results/deployment.log 2>&1
        docker compose ps --all --format json > test-results/containers.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: e2e-results-${{ matrix.storage }}-${{ matrix.deployment }}
        path: test-results/
        retention-days: 7
    - name: Tear down deployment
      if: always()
      env:
        COMPOSE_FILE: ${{ matrix.compose_file }}
        COMPOSE_PROFILES: ${{ matrix.compose_profiles }}
        COMPOSE_PROJECT_NAME: booru-e2e
      run: docker compose down --volumes --remove-orphans

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, image, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: e2e-image
        path: ${{ runner.temp }}/e2e-image
    - run: docker load --input "$RUNNER_TEMP/e2e-image/booru-image.tar"
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish tested image
      env:
        IMAGE_TAGS: ${{ needs.image.outputs.tags }}
      run: |
        test -n "$IMAGE_TAGS"
        while IFS= read -r tag; do
          docker tag booru-thingy:e2e "$tag"
          docker push "$tag"
        done <<< "$IMAGE_TAGS"
