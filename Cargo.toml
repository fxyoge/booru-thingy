[package]
name = "booru-thingy"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small headless booru backend"

[dependencies]
anyhow = "1"
apalis = "=1.0.0"
apalis-postgres = "=1.0.0"
apalis-cron = "=1.0.0"
aws-sdk-s3 = "1"
aws-credential-types = "1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
confique = { version = "0.4", features = ["toml"] }
cron = "0.17"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
include_dir = "0.7"
md-5 = "0.10"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "migrate"] }
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
ulid = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[workspace.lints.rust]
warnings = "deny"
unused_crate_dependencies = "deny"

[profile.release]
strip = true
lto = "thin"
